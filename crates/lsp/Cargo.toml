[package]
name = "lsp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "roo-lang's language server -- diagnostics over stdio for editor integration"
readme = "../../README.md"
license.workspace = true
keywords = ["lsp", "compiler"]
categories = ["compilers", "development-tools"]
# repository.workspace = true

[[bin]]
name = "roo-lsp"
path = "src/main.rs"

[dependencies]
ast = { version = "0.1.0", path = "../ast" }
lexer = { version = "0.1.0", path = "../lexer" }
parser = { version = "0.1.0", path = "../parser" }
typecheck = { version = "0.1.0", path = "../typecheck" }
chumsky = { version = "0.13.0", features = ["pratt"] }
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1"

[lints]
workspace = true
